apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-a
  namespace: pki-lab
spec:
  replicas: 1
  selector: { matchLabels: { app: nginx-a } }
  template:
    metadata: { labels: { app: nginx-a } }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          args: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
          ports: [{ containerPort: 8443 }]
          volumeMounts:
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
            - { name: cfg, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
      volumes:
        - name: tls
          secret: { secretName: tls-a }
        - name: cfg
          configMap: { name: nginx-a-conf }
---
